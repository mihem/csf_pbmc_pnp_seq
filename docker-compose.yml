services:
  csf_pbmc_pnp_seq:
    image: mihem/csf_pbmc_pnp_seq:v0.7
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-100}"
    working_dir: /csf_pbmc_pnp_seq
    environment:
      HOME: /tmp
      RENV_CONFIG_SANDBOX_ENABLED: "FALSE"
      RENV_CONFIG_SYNCHRONIZED_CHECK: "FALSE"
      TAR_INCLUDE_HEAVY: "${TAR_INCLUDE_HEAVY:-false}"
    volumes:
      - .:/csf_pbmc_pnp_seq
    mem_limit: "${PIPELINE_MEMORY_LIMIT:-48g}"
    memswap_limit: "${PIPELINE_MEMORY_LIMIT:-48g}"
    command: Rscript -e "targets::tar_make()"
    restart: "no"

  dag:
    image: mihem/csf_pbmc_pnp_seq:v0.7
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-100}"
    working_dir: /csf_pbmc_pnp_seq
    environment:
      HOME: /tmp
      RENV_CONFIG_SANDBOX_ENABLED: "FALSE"
      RENV_CONFIG_SYNCHRONIZED_CHECK: "FALSE"
      TAR_INCLUDE_HEAVY: "${TAR_INCLUDE_HEAVY:-false}"
    volumes:
      - .:/csf_pbmc_pnp_seq
    mem_limit: "8g"
    memswap_limit: "8g"
    command: Rscript -e "source('R/pipeline_dag.R'); write_targets_dag()"
    restart: "no"
